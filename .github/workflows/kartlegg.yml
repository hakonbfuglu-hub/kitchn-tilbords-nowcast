name: Kartlegging

# Henter et lite utvalg rå sider fra kitchn.no og tilbords.no til rapport/probe/
# (ca. 25 forespørsler). Brukes når tolkingen skal skrives eller justeres.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kjor_kartlegg.txt"
      - "scraper/probe.py"

permissions:
  contents: write

concurrency:
  group: innsamling
  cancel-in-progress: false

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: pip install -r requirements.txt 2>&1 | tail -3
      - name: Kartlegg
        shell: bash
        run: |
          mkdir -p rapport/probe
          python -u -m scraper kartlegg 2>&1 | tee rapport/probe/logg.txt
      - name: Lagre resultater i repoet
        if: always()
        shell: bash
        run: |
          git config user.name "homeco-nowcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rapport
          git commit -m "Kartlegging $(date -u +%F)" || echo "ingen endringer"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
